# Databricks Apps reads this file to know how to start your app.
# Docs: the app runtime installs app/requirements.txt automatically, then runs this command.
command: ["streamlit", "run", "app.py"]

env:
  - name: "SERVING_ENDPOINT_NAME"
    value: "news_qa_agent_endpoint"
  - name: "ALLOWED_GROUP_NAME"
    value: "newsscan-agent-users"  # change to whatever group you actually want to gate access with
  - name: "ALLOWED_USERS"
    value: ""  # comma-separated individual emails, e.g. "you@company.com,teammate@company.com" -- optional, works alongside the group check
