# Databricks Apps reads this file to know how to start your app.
# Docs: the app runtime installs app/requirements.txt automatically, then runs this command.
command: ["streamlit", "run", "app.py"]

env:
  - name: "SERVING_ENDPOINT_NAME"
    value: "news_qa_agent_endpoint"
  - name: "ALLOWED_GROUPS"
    value: "data-engineers,data-scientists,business-analysts,project-managers"  # demo set -- membership in ANY one grants access; edit this list to change which roles are allowed later
  - name: "ALLOWED_USERS"
    value: "nishthajain3005@gmail.com"  # comma-separated individual emails, e.g. "you@company.com,teammate@company.com" -- optional, works alongside the group check